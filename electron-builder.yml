# Identidad PROPIA de la versión LITE, distinta de TuCajero V2 (com.tucajero.pos) y de TuCajero V3 (com.tucajero.pos.v3).
# El instalador decide qué programa reemplaza por el appId: con uno propio, la Lite se instala en su carpeta
# ("TuCajero Lite") y no toca a V2 ni a V3. Sus datos van a %APPDATA%	ucajero-lite (nombre del paquete).
appId: com.tucajero.pos.lite
productName: TuCajero Lite
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - app/renderer/public/**/*
  - database/migrations/**/*
  - build/icon.ico
  - node_modules/**/*
  - package.json
  - '!node_modules/@types/**/*'
  - '!node_modules/.bin/**/*'
  - '!node_modules/typescript/**/*'
  - '!**/*.ts'
  - '!**/*.tsx'
  - '!**/*.map'
  - '!**/*.md'
  - '!**/tests/**/*'
asar: true
asarUnpack:
  - '**/*.node'
  - 'node_modules/better-sqlite3/**/*'

win:
  target:
    - nsis
  # Nombre fijo (sin espacios) para que el enlace de descarga y latest.yml no cambien con el nombre del producto.
  artifactName: TuCajero-Lite-Setup-${version}.${ext}
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: TuCajero Lite
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: franciscollinas
  repo: TuCajeroV3
  releaseType: release
  # Canal propio: la Lite solo se actualiza con lite.yml, nunca con las versiones normales de V3.
  channel: lite
  private: false

compression: maximum

buildDependenciesFromSource: true

# Code signing configuration
# electron-builder firma automáticamente cuando detecta credenciales en el
# entorno (no commits de secretos). Activa cualquiera de las dos vías y vuelve a
# ejecutar `npm run dist`:
#
# Opción A — Certificado .pfx:
#   $env:CSC_LINK="C:\ruta\certificado.pfx"
#   $env:CSC_KEY_PASSWORD="password"
#
# Opción B — Archivo de configuración (alternativa a env):
#   certificateFile: C:\ruta\certificado.pfx
#   certificatePassword: password
#
# Nota: el sello temporal (timestamp RFC3161 + SHA-256) lo añade electron-builder
# automáticamente al firmar.
