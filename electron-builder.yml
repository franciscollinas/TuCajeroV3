appId: com.tucajero.pos
productName: TuCajero
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - app/renderer/public/**/*
  - database/migrations/**/*
  - build/icon.ico
  - node_modules/**/*
  - package.json
  - '!node_modules/@types/**/*'
  - '!node_modules/.bin/**/*'
  - '!node_modules/typescript/**/*'
  - '!**/*.ts'
  - '!**/*.tsx'
  - '!**/*.map'
  - '!**/*.md'
  - '!**/tests/**/*'
asar: true
asarUnpack:
  - '**/*.node'
  - 'node_modules/better-sqlite3/**/*'

win:
  target:
    - nsis
    - portable
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: TuCajero
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: franciscollinas
  repo: TuCajeroV3
  releaseType: release
  private: false

compression: maximum

# Code signing configuration
# electron-builder firma automáticamente cuando detecta credenciales en el
# entorno (no commits de secretos). Activa cualquiera de las dos vías y vuelve a
# ejecutar `npm run dist`:
#
# Opción A — Certificado .pfx:
#   $env:CSC_LINK="C:\ruta\certificado.pfx"
#   $env:CSC_KEY_PASSWORD="password"
#
# Opción B — Archivo de configuración (alternativa a env):
#   certificateFile: C:\ruta\certificado.pfx
#   certificatePassword: password
#
# Nota: el sello temporal (timestamp RFC3161 + SHA-256) lo añade electron-builder
# automáticamente al firmar.
