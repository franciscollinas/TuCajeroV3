appId: com.tucajero.pos
productName: TuCajero
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - app/renderer/public/**/*
  - node_modules/**/*
  - package.json
  - '!node_modules/@types/**/*'
  - '!node_modules/.bin/**/*'
  - '!node_modules/typescript/**/*'
  - '!**/*.ts'
  - '!**/*.tsx'
  - '!**/*.map'
  - '!**/*.md'
  - '!**/tests/**/*'
  - '!**/*.cjs'
asar: true
asarUnpack:
  - '**/*.node'
  - 'node_modules/better-sqlite3/**/*'

win:
  target:
    - nsis
    - portable
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: TuCajero
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: franciscollinas
  repo: TuCajeroV3
  releaseType: release
  private: false

compression: maximum

# Code signing configuration
# To enable, obtain a code signing certificate and configure:
# certificateFile: path/to/certificate.p12
# certificatePassword: your-certificate-password
# sign: null  # uncomment and set path to signtool.exe if needed
